<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t d">
<title id="t">Final reward after hyperparameter tuning</title>
<desc id="d">Original settings: ~280; Best combination: ~520; Best, but clip 0.2: ~480; Best, but batch 200: ~490; Best, but 20 epochs: ~470</desc>
<style>
  .title { font: 600 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #111; }
  .label, .value { font: 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #333; }
  .bar { fill: #8fb3e3; }
  .bar.hi { fill: #1f5fae; }
  @media (prefers-color-scheme: dark) {
    .title { fill: #e3e5e8; }
