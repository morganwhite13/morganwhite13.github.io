<rect class="bar hi" x="0" y="110" width="456" height="20" rx="3"/>
<text class="value" x="464" y="125">~520</text>
<text class="label" x="0" y="157">Best, but clip 0.2</text>
<rect class="bar" x="0" y="162" width="421" height="20" rx="3"/>
<text class="value" x="429" y="177">~480</text>
<text class="label" x="0" y="209">Best, but batch 200</text>
