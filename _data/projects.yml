- title: Agent Elimination in Multi-Agent Reinforcement Learning
  url: /projects/marl-elimination/
  emoji: 🧠
  when: Honours project, Fall 2024
  featured: true
  tech: [Unity ML-Agents, C#, Python, PPO, SAC, POCA]
  repo: https://github.com/morganwhite13/Agent-Elimination-in-Multi-Agent-Reinforcement-Learning
  summary: >-
    Honours research asking whether letting agents eliminate each other makes them cooperate
    in a resource-sharing social dilemma. I built a custom Unity ML-Agents environment with
    configurable elimination rules and compared PPO, SAC and POCA over 500K training steps.
  highlights:
    - Configurable elimination mechanics (freeze, permanent, group vote) for 1–4 agents
    - "Finding: elimination didn't deter greed; agents learned to eliminate early and harvest alone"
    - SAC reached the highest reward of the three algorithms
  glance:
    problem: In a social dilemma, grabbing resources pays off for each agent but hurts the group. Can the threat of being eliminated by peers make agents cooperate?
    approach: A Harvest-style Unity ML-Agents environment where agents can freeze or permanently eliminate others by shooting them, trained with PPO, SAC and POCA for 500K steps.
    result: No. The no-elimination baseline scored highest (about 12,000 vs 9,000–11,500); agents learned to eliminate each other early and then harvest alone. SAC was the strongest algorithm.

- title: MARL Robustness for Agent Blindness in VMAS
  url: /projects/vmas-blindness/
  emoji: 🔍
  when: Course research project
  featured: true
  tech: [Python, PyTorch, TorchRL, VMAS, MAPPO]
  repo: https://github.com/morganwhite13/Improving-MARL-Robustness-for-Agent-Blindness-in-VMAS
  summary: >-
    How well do swarm agents cooperate when they randomly lose their sensors? I built six
    "blindness" scenarios in VMAS and trained MAPPO across 50+ experiments, improving
    performance by 86% over the baseline configuration.
  highlights:
    - Six probabilistic blindness scenarios with configurable duration and frequency
    - Advantage normalization turned out to be essential under observation loss
    - Performance degraded gracefully up to a 30% blindness probability
  glance:
    problem: Robot swarms need to keep cooperating when some agents' sensors fail.
    approach: Six "blindness" scenarios in VMAS that randomly zero out agents' observations, trained with MAPPO in TorchRL, plus a 50+ run hyperparameter study.
    result: Tuning raised final reward from about 280 to about 520 (+86%), and agents kept 73% of their no-blindness reward at a 20% blindness probability and 59% at 30%. Single seed per configuration.

- title: Autonomous Robot Jar Collection System
  url: /projects/robot-project/
  emoji: 🤖
  when: Fall 2021, updated 2025
  featured: true
  tech: [Webots, Java, Computer Vision, Sensor Fusion]
  repo: https://github.com/morganwhite13/Autonomous-Robot-Jar-Collection-System
  summary: >-
    A mobile robot that navigates a 20×20 m simulated warehouse, finds honey jars with
    colour-based vision, picks them up and stores them, with no human input.
  highlights:
    - Collected all 5 jars in every trial
    - ±3° heading and ±10 cm position accuracy using compass-based navigation
    - Fuses camera, compass, distance and touch sensors, with fallback detection logic
  glance:
    problem: Find, pick up and store jars in a 20×20 m warehouse using only the robot's own sensors.
    approach: Colour-threshold vision, compass-based navigation, distance and touch sensing, and a phased mission planner, written in Java for Webots.
    result: All 5 jars collected in every trial, with ±3° heading and ±10 cm position accuracy.

- title: YouTube Views Prediction with Neural Networks
  url: /projects/youtube-predictor/
  emoji: 🎬
  when: Course project (Intro to AI)
  featured: true
  tech: [Python, TensorFlow, Bidirectional LSTMs, YouTube Data API, NLTK]
  repo: https://github.com/morganwhite13/YouTube-Views-Prediction-Using-Neural-Networks
  summary: >-
    Predicts a video's view count from its title, description, channel, category, subscriber
    count and age. I collected the data through the YouTube API and built the model up in six
    stages, adding one input at a time, with a bidirectional LSTM per text field.
  highlights:
    - Data collection with five sampling strategies, caching and English-only filtering
    - Six model stages to compare what each input adds
    - What-if predictions that vary one input at a time
  glance:
    problem: Predict how many views a YouTube video will get from its title, description, channel, category, subscriber count and age.
    approach: Data collected with the YouTube Data API, NLTK preprocessing, and a Keras multi-input model with a bidirectional LSTM for each text field, built up in six stages.
    result: The full pipeline runs end to end, from API collection to what-if predictions. Test error wasn't recorded, and the write-up explains what I'd change first (log-scale target, a baseline, a smaller model).

- title: Stock Price Changes from Reddit Sentiment
  url: /projects/stock-predictor/
  emoji: 📈
  when: Winter 2024
  featured: false
  tech: [Python, TensorFlow, PRAW, yfinance, VADER]
  repo: https://github.com/morganwhite13/Predicting-Stock-Price-Changes-Using-Reddit-Sentiment
  repo_label: Documentation
  summary: >-
    A multi-input LSTM network that predicts daily stock price changes by combining Yahoo
    Finance data with VADER sentiment scores of posts from r/stocks, r/options and r/investing.
  highlights:
    - Separate branches for post titles, post bodies and numerical features
    - Reddit posts matched to same-day price movements
    - Data pipelines built on the Reddit (PRAW) and Yahoo Finance APIs
  glance:
    problem: Does Reddit sentiment help predict a stock's daily price change?
    approach: A multi-input LSTM over post titles and bodies, VADER sentiment and engagement features, joined with same-day price changes from Yahoo Finance.
    result: A working end-to-end pipeline. The reported errors are optimistic because the random train/validation split leaks shared targets; the page explains how a fair test would work.

