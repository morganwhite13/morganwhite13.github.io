name: Check site

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an older run pointless
concurrency:
  group: check-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-proof:
    runs-on: ubuntu-latest
    # The job normally takes about a minute; fail fast if a download hangs
    timeout-minutes: 20
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build
      - name: Check internal links
        run: bundle exec htmlproofer _site --disable-external
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install accessibility check tools
        timeout-minutes: 10
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check accessibility
        run: npm run check:a11y
