name: Check external links

# External sites can be slow or flaky, so this runs weekly and on PRs that
# change content, separately from the main site check.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "**.md"
      - "_data/**"
      - "_layouts/**"
      - "_includes/**"

jobs:
  external-links:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build
      # LinkedIn and ScienceDirect block automated requests, and the site's own
      # URLs are covered by the internal check, so those are skipped
      - name: Check external links
        run: >-
          bundle exec htmlproofer _site
          --ignore-status-codes 429
          --ignore-urls "/linkedin\.com/,/sciencedirect\.com/,/morganwhite13\.github\.io/"
          --typhoeus '{"followlocation": true, "connecttimeout": 15, "timeout": 30}'
