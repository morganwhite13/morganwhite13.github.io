# Site settings
title: Morgan White · AI Developer
email: morgan13white@icloud.com
description: >-
  AI developer and Carleton University Computer Science Honours graduate
  working on applied machine learning, NLP and multi-agent reinforcement learning.
author: Morgan White
baseurl: "" # leave empty for username.github.io
url: "https://morganwhite13.github.io"

# Social media
github_username: morganwhite13
linkedin_username: morgan-white-95b245237

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Navigation
header_pages:
  - projects.md
  - about.md

# Project write-ups use the project layout (contents list and project links);
# every page gets the social preview image
defaults:
  - scope:
      path: "projects"
    values:
      layout: project
  - scope:
      path: ""
    values:
      image: /assets/social-card.png

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
